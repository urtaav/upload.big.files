# =============================================================================
# upload-api - minimal local infrastructure (first stage)
# PostgreSQL + MinIO only. Kafka is added in a later stage.
#
#   docker compose up -d --build
#   docker compose ps
# =============================================================================

name: upload-api

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: upload
      POSTGRES_PASSWORD: upload
      POSTGRES_DB: upload
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U upload -d upload"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # The browser PUTs each part straight to MinIO and must read the ETag of
      # the response. Local development infrastructure only.
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:5173,http://127.0.0.1:5173"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # One-shot job that creates the bucket before the API starts uploading.
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c '
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/video-uploads
      '
    restart: "no"

volumes:
  pgdata:
  miniodata: